<svg xmlns="http://www.w3.org/2000/svg" width="480" height="376" viewBox="0 0 480 376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <!-- Terminal Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <!-- NEW: The mask that reveals and erases the image -->
    <!-- Height goes 0 -> 316 (revealing) then 316 -> 0 (erasing) in sync with the laser -->
    <clipPath id="image-wipe">
      <rect x="0" y="30" width="480" height="0">
        <animate attributeName="height" values="0; 316; 0" dur="4s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Keeps the scanner effects safely inside the terminal window -->
    <clipPath id="terminal-clip">
        <rect x="0" y="30" width="480" height="316"/>
    </clipPath>
  </defs>

  <!-- Static Terminal UI -->
  <rect width="480" height="376" rx="12" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="479" height="375" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
  <line x1="0" y1="30" x2="480" y2="30" stroke="#30363d"/>
  <circle cx="20" cy="15.0" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="15.0" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="15.0" r="5" fill="#27c93f"/>
  <text x="240.0" y="19.0" fill="#7d8590" font-size="12" text-anchor="middle">ommprakash@github: ~$ ./portrait.sh</text>

  <!-- ======================================================= -->
  <!-- IMAGE & ANIMATION CONTAINER -->
  <g clip-path="url(#terminal-clip)">
    
    <!-- APPLY THE REVEAL/ERASE MASK TO THE IMAGE GROUP -->
    <g clip-path="url(#image-wipe)">
        <!-- PASTE YOUR ADOBE SVG INSIDE THIS GROUP -->
        <g transform="translate(60, 40) scale(0.6)"> 
            
            <!-- *** PASTE ADOBE CODE HERE *** -->

        </g>
    </g>

    <!-- EFFECT 1: Scrambling Raster Cursor -->
    <!-- Bounces up and down seamlessly with the laser line -->
    <rect x="0" y="30" width="6" height="8" fill="#3fb950" opacity="0.4">
      <animate attributeName="x" from="-10" to="480" dur="0.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="30; 340; 30" dur="4s" repeatCount="indefinite" />
    </rect>

    <!-- EFFECT 2: Bi-directional Scanner Line & Glow -->
    <g>
      <!-- The bright laser line -->
      <line x1="0" y1="30" x2="480" y2="30" stroke="#0ea5e9" stroke-width="1.5" opacity="0.6">
          <animate attributeName="y1" values="30; 346; 30" dur="4s" repeatCount="indefinite" />
          <animate attributeName="y2" values="30; 346; 30" dur="4s" repeatCount="indefinite" />
      </line>
      <!-- The soft blue glow tracking with the laser -->
      <rect x="0" y="20" width="480" height="20" fill="#0ea5e9" opacity="0.1">
          <animate attributeName="y" values="20; 336; 20" dur="4s" repeatCount="indefinite" />
      </rect>
    </g>

  </g>
  <!-- ======================================================= -->

  <!-- Bottom Footer Line -->
  <line x1="0" y1="346" x2="480" y2="346" stroke="#30363d"/>

  <!-- Static whoami text -->
  <text x="20" y="365" fill="#7d8590" font-size="13">ommprakash@github:~$ whoami <tspan fill="#c9d1d9">Ommprakash Mohanty</tspan></text>

  <!-- Blinking Terminal Cursor at bottom -->
  <rect x="290" y="354" width="8" height="14" fill="#c9d1d9">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
