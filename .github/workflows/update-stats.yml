# ============================================================
# GitHub Actions: Auto-update profile SVGs with live stats
# Runs daily at 00:15 UTC and on every push to main.
# ============================================================

name: Update Profile Stats

on:
  schedule:
    # Run daily at 00:15 UTC
    - cron: "15 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inject live stats into SVGs
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/inject_stats.py

      - name: Commit and push updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update profile stats [skip ci]"
            git push
          fi
