name: Generate Snake

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Grants the action permission to push to your repository
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Generate the snake animation
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: OmmprakashMohanty01
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          # Authenticates the API request to prevent rate limiting
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Push the generated SVGs to the 'output' branch
      - name: Push snake animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          # Grants permission to push the newly created branch/files
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
